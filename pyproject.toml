[project]
name = "eczis"
version = "0.1.0"
description = "Evidence-Aware Continuous Zoom Imaging System — synthetic software proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pillow>=11",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov>=7",
  "hypothesis>=6",
  "mypy>=1.18",
  "ruff>=0.14",
  "types-Pillow>=10",
]
browser = [
  "playwright>=1.50",
]

[project.scripts]
eczis = "eczis.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["browser: visible-browser viewer tests (set ECZIS_BROWSER_TESTS=1)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
