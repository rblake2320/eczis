# UNFILED-IP
name: Bootstrap ECZIS v0.2

on:
  push:
    branches:
      - release/v0.2-production
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eczis-v02-bootstrap
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/v0.2-production

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/v0.2/v02part-*.b64 > /tmp/eczis-v0.2.b64
          base64 --decode /tmp/eczis-v0.2.b64 > /tmp/eczis-v0.2.zip
          echo "50d6abe55d3176620c9376c69370b20a90d6405ca3dd4e14c9046444e9f992f6  /tmp/eczis-v0.2.zip" | sha256sum --check --strict
          rm -rf /tmp/eczis-v0.2
          mkdir -p /tmp/eczis-v0.2
          unzip -q /tmp/eczis-v0.2.zip -d /tmp/eczis-v0.2

      - name: Replace branch contents with ECZIS v0.2 source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/eczis-v0.2/ ./
          git show origin/main:AGENTS.md > AGENTS.md
          git show origin/main:CLAUDE.md > CLAUDE.md
          test ! -e bootstrap
          test ! -e .github/workflows/bootstrap-v02.yml

      - name: Apply validated CI compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected patch context not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/eczis/bench/harness.py",
              "    if truth_model.__class__ is estimated_model.__class__:\n",
              "    truth_cls: type[object] = truth_model.__class__\n"
              "    estimated_cls: type[object] = estimated_model.__class__\n"
              "    if truth_cls is estimated_cls:\n",
          )
          replace(
              "src/eczis/cli.py",
              "def _save_gray(path: Path, array: np.ndarray) -> None:\n",
              "def _models_are_distinct() -> bool:\n"
              "    truth_cls: type[object] = TruthCameraModel\n"
              "    estimated_cls: type[object] = EstimatedCameraModel\n"
              "    return truth_cls is not estimated_cls\n\n\n"
              "def _save_gray(path: Path, array: np.ndarray) -> None:\n",
          )
          replace(
              "src/eczis/cli.py",
              '        "models_are_distinct": TruthCameraModel is not EstimatedCameraModel,\n',
              '        "models_are_distinct": _models_are_distinct(),\n',
          )
          replace(
              "src/eczis/provenance/observability.py",
              "    return np.clip(support_hr * diversity, 0.0, 1.0).astype(np.float32)\n",
              "    return np.asarray(np.clip(support_hr * diversity, 0.0, 1.0), dtype=np.float32)\n",
          )
          replace(
              "src/eczis/recon/shift_add.py",
              "    return np.clip(image, 0.0, 1.0).astype(np.float32)\n",
              "    return np.asarray(np.clip(image, 0.0, 1.0), dtype=np.float32)\n",
          )
          replace(
              "src/eczis/schemas.py",
              "    I = 1\n",
              "    I = 1  # noqa: E741 — canonical M/R/I/U provenance class name (Inferred)\n",
          )
          replace(
              "tools/claims_check.py",
              "    required = set()\n",
              "    required: set[str] = set()\n",
          )

          for workflow in Path(".github/workflows").glob("*.yml"):
              text = workflow.read_text(encoding="utf-8")
              text = text.replace("astral-sh/setup-uv@v8\n", "astral-sh/setup-uv@v8.3.2\n")
              workflow.write_text(text, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize environment
        run: uv sync --all-groups

      - name: IP disclosure gate
        run: uv run python tools/ip_gate.py

      - name: Private-data gate
        run: uv run python tools/private_data_gate.py

      - name: Release claims gate
        run: uv run python tools/claims_check.py

      - name: Ruff autofix and validation
        run: |
          uv run ruff check . --fix
          uv run ruff check .

      - name: Mypy strict
        run: uv run mypy src tools

      - name: Tests and coverage
        run: uv run pytest --cov=eczis --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Commit validated ECZIS v0.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat: upgrade ECZIS to v0.2 production research platform"
          git push origin HEAD:release/v0.2-production
