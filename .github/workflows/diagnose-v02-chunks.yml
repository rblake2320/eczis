# UNFILED-IP
name: Diagnose ECZIS v0.2 Chunks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.2-production
      - name: Report chunk sizes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          wc -c bootstrap/v0.2/v02part-*.b64
          sha256sum bootstrap/v0.2/v02part-*.b64
