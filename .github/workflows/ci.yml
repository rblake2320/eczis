# UNFILED-IP
name: ECZIS CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eczis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize environment
        run: uv sync --all-groups

      - name: IP disclosure gate
        run: uv run python tools/ip_gate.py

      - name: Release claims gate
        run: uv run python tools/claims_check.py

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy strict
        run: uv run mypy src tools

      - name: Tests and coverage
        run: uv run pytest --cov=eczis --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
