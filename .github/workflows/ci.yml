# UNFILED-IP
name: ECZIS CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eczis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize environment
        run: uv sync --all-groups

      - name: IP disclosure gate
        run: uv run python tools/ip_gate.py

      - name: Evidence / personal-media guard
        run: uv run python tools/evidence_guard.py

      - name: Release claims gate (static)
        run: uv run python tools/claims_check.py

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy strict
        run: uv run mypy src tools tests

      - name: Tests and coverage
        run: uv run pytest --cov=eczis --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --junitxml=test-results.xml

      - name: Release verification (executed claims, skip classification, demo bundle)
        shell: bash
        run: |
          uv run eczis demo --output artifacts/ci-demo --iterations 8
          uv run python tools/verify_release.py --junit test-results.xml --output release/release_manifest.json \
            --bundle artifacts/ci-demo/eczis_demo.eczis --dev-seed 20260803

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.os }}
          path: |
            coverage.xml
            test-results.xml
            release/
          if-no-files-found: ignore
          retention-days: 14

  locked-benchmark:
    name: Locked-test benchmark matrix (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pytest -m full_benchmark -o addopts="" --junitxml=benchmark-results.xml
      - run: uv run eczis bench --output artifacts/bench --split locked_test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: locked-benchmark
          path: |
            benchmark-results.xml
            artifacts/bench/BENCHMARK.md
            artifacts/bench/benchmark_matrix.json
          retention-days: 30
